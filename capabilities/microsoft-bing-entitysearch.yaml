naftiko: 1.0.0-alpha2
info:
  label: Bing Search APIs — EntitySearch
  description: 'Bing Search APIs — EntitySearch. 1 operations. Lead operation: Entity search. Self-contained Naftiko capability
    covering one Microsoft Bing business surface.'
  tags:
  - Microsoft Bing
  - EntitySearch
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MICROSOFT_BING_API_KEY: MICROSOFT_BING_API_KEY
capability:
  consumes:
  - type: http
    namespace: microsoft-bing-entitysearch
    baseUri: https://api.bing.microsoft.com
    description: Bing Search APIs — EntitySearch business capability. Self-contained, no shared references.
    resources:
    - name: v7.0-entities
      path: /v7.0/entities
      operations:
      - name: entitysearch
        method: GET
        description: Entity search
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: Ocp-Apim-Subscription-Key
      value: '{{env.MICROSOFT_BING_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: microsoft-bing-entitysearch-rest
    port: 8080
    description: REST adapter for Bing Search APIs — EntitySearch. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/v7-0/entities
      name: v7-0-entities
      description: REST surface for v7.0-entities.
      operations:
      - method: GET
        name: entitysearch
        description: Entity search
        call: microsoft-bing-entitysearch.entitysearch
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: microsoft-bing-entitysearch-mcp
    port: 9090
    transport: http
    description: MCP adapter for Bing Search APIs — EntitySearch. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: entity-search
      description: Entity search
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: microsoft-bing-entitysearch.entitysearch
      outputParameters:
      - type: object
        mapping: $.
