naftiko: 1.0.0-alpha2
info:
  label: Bing Search APIs — Autosuggest
  description: 'Bing Search APIs — Autosuggest. 1 operations. Lead operation: Autosuggest. Self-contained Naftiko capability
    covering one Microsoft Bing business surface.'
  tags:
  - Microsoft Bing
  - Autosuggest
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MICROSOFT_BING_API_KEY: MICROSOFT_BING_API_KEY
capability:
  consumes:
  - type: http
    namespace: microsoft-bing-autosuggest
    baseUri: https://api.bing.microsoft.com
    description: Bing Search APIs — Autosuggest business capability. Self-contained, no shared references.
    resources:
    - name: v7.0-suggestions
      path: /v7.0/suggestions
      operations:
      - name: autosuggest
        method: GET
        description: Autosuggest
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: Ocp-Apim-Subscription-Key
      value: '{{env.MICROSOFT_BING_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: microsoft-bing-autosuggest-rest
    port: 8080
    description: REST adapter for Bing Search APIs — Autosuggest. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/v7-0/suggestions
      name: v7-0-suggestions
      description: REST surface for v7.0-suggestions.
      operations:
      - method: GET
        name: autosuggest
        description: Autosuggest
        call: microsoft-bing-autosuggest.autosuggest
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: microsoft-bing-autosuggest-mcp
    port: 9090
    transport: http
    description: MCP adapter for Bing Search APIs — Autosuggest. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: autosuggest
      description: Autosuggest
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: microsoft-bing-autosuggest.autosuggest
      outputParameters:
      - type: object
        mapping: $.
