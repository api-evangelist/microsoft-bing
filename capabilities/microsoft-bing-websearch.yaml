naftiko: 1.0.0-alpha2
info:
  label: Bing Search APIs — WebSearch
  description: 'Bing Search APIs — WebSearch. 1 operations. Lead operation: Web search. Self-contained Naftiko capability
    covering one Microsoft Bing business surface.'
  tags:
  - Microsoft Bing
  - WebSearch
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MICROSOFT_BING_API_KEY: MICROSOFT_BING_API_KEY
capability:
  consumes:
  - type: http
    namespace: microsoft-bing-websearch
    baseUri: https://api.bing.microsoft.com
    description: Bing Search APIs — WebSearch business capability. Self-contained, no shared references.
    resources:
    - name: v7.0-search
      path: /v7.0/search
      operations:
      - name: websearch
        method: GET
        description: Web search
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: Ocp-Apim-Subscription-Key
      value: '{{env.MICROSOFT_BING_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: microsoft-bing-websearch-rest
    port: 8080
    description: REST adapter for Bing Search APIs — WebSearch. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/v7-0/search
      name: v7-0-search
      description: REST surface for v7.0-search.
      operations:
      - method: GET
        name: websearch
        description: Web search
        call: microsoft-bing-websearch.websearch
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: microsoft-bing-websearch-mcp
    port: 9090
    transport: http
    description: MCP adapter for Bing Search APIs — WebSearch. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: web-search
      description: Web search
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: microsoft-bing-websearch.websearch
      outputParameters:
      - type: object
        mapping: $.
